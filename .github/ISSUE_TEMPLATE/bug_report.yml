name: Something isn't working
description: Report a bug in Kanbanto.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time! Please check the [troubleshooting guide](https://github.com/baibao577/kanbanto/blob/main/docs/troubleshooting.md) first.
        **Security problems:** please report them privately instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we see it happen?
      placeholder: |
        1. Open a board…
        2. Drag a card…
  - type: dropdown
    id: setup
    attributes:
      label: How do you run Kanbanto?
      options:
        - On my own computer (Docker Desktop)
        - On a server, with the HTTPS add-on
        - On a server, behind my own proxy
        - On a hosting platform (Railway, Render, Fly.io…)
        - For development (pnpm dev)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release (e.g. v0.1.0), or the date you downloaded it.
  - type: textarea
    id: logs
    attributes:
      label: Server logs
      description: 'Output of `docker compose logs --tail 100 app`. **Remove keys, passwords, email addresses and share links first.**'
      render: text
